spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nubilab
    username: nubilab
    password: nubilab1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update        # 스켈레톤이므로 auto로 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
